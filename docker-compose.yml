version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ledgerdb
    ports:
      - "15432:5432" # ใช้พอร์ต 5434 เพื่อไม่ให้ชนกับระบบอื่นในเครื่อง
    volumes:
      - pgdata_ledger:/var/lib/postgresql/data
      - ./migrations/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  redis:
    image: redis:7-alpine
    container_name: ledger-redis
    ports:
      - "6380:6379" # ใช้พอร์ต 6380

volumes:
  pgdata_ledger: